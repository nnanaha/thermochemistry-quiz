<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermochemistry Warm-Up Challenge</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            box-sizing: border-box;
            position: relative;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.6rem;
            color: var(--primary);
        }

        .progress-bar {
            height: 8px;
            background-color: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .graphic-container {
            background-color: #f9fafb;
            border: 1px dashed #d1d5db;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }

        .options-grid {
            display: grid;
            gap: 10px;
        }

        .btn-option {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            font-weight: 500;
        }

        .btn-option:hover:not(:disabled) {
            background-color: #e0e7ff;
            border-color: var(--primary);
        }

        .btn-option.correct {
            background-color: #d1fae5;
            border-color: var(--success);
            color: #065f46;
        }

        .btn-option.wrong {
            background-color: #fee2e2;
            border-color: var(--danger);
            color: #991b1b;
        }

        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .feedback-box.correct {
            background-color: #ecfdf5;
            border: 1px solid #10b981;
            color: #065f46;
        }

        .feedback-box.wrong {
            background-color: #fef2f2;
            border: 1px solid #ef4444;
            color: #991b1b;
        }

        .btn-next {
            margin-top: 20px;
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }

        .btn-next:hover {
            background-color: var(--primary-hover);
        }

        .score-screen {
            text-align: center;
            display: none;
        }

        .score-screen h2 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0;
            color: var(--text);
        }

        .btn-restart {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Header -->
    <div class="header">
        <h1>🧪 Warm-Up Challenge: Thermochemistry</h1>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
    </div>

    <!-- Quiz Area -->
    <div id="quiz-screen">
        <div class="question-title" id="question-text">Loading question...</div>
        
        <!-- Optional Visual / Diagram Area -->
        <div class="graphic-container" id="graphic-area" style="display: none;"></div>

        <!-- Options Container -->
        <div class="options-grid" id="options-container"></div>

        <!-- Feedback Box -->
        <div class="feedback-box" id="feedback-box"></div>

        <!-- Next Button -->
        <button class="btn-next" id="btn-next" onclick="nextQuestion()">Next Question ➔</button>
    </div>

    <!-- Score Screen -->
    <div class="score-screen" id="score-screen">
        <h2>Great Job! 🎉</h2>
        <p>You have completed the Thermochemistry Recall Challenge.</p>
        <div class="score-display" id="final-score">0/0</div>
        <p id="score-message"></p>
        <button class="btn-restart" onclick="restartQuiz()">Try Again 🔄</button>
    </div>
</div>

<script>
    /* =========================================================================
       EDIT YOUR QUESTIONS HERE!
       -------------------------------------------------------------------------
       Structure:
       - question: "The question text (supports HTML tags like <b> or <sub>)"
       - graphic: optional ASCII diagram or text (set to null if not needed)
       - options: array of answer choices
       - answer: index of the correct answer (0 = first option, 1 = second, etc.)
       - explanation: explanation displayed after answering
       ========================================================================= */

    const questions = [
        {
            question: "1. When wood burns in a bonfire, the wood and oxygen gas act as the ..., while the surrounding air and your hands feeling warm act as the ...",
            graphic: null,
            options: [
                "Surrounding ; System",
                "System ; Surrounding",
                "Reactants ; Products",
                "Enthalpy ; Heat"
            ],
            answer: 1,
            explanation: "The <b>System</b> is the reaction being observed (wood combustion), while the <b>Surrounding</b> is everything else in the universe that interacts with it."
        },
        {
            question: "2. A student dissolves a solid salt in water. The beaker immediately feels cold to the touch. Which set of characteristics correctly describes this chemical process?",
            graphic: null,
            options: [
                "Heat flows from system to surroundings | ΔH is negative (-) | E_products < E_reactants",
                "Heat flows from surroundings to system | ΔH is positive (+) | E_products > E_reactants",
                "Heat flows from system to surroundings | ΔH is positive (+) | E_products > E_reactants",
                "Heat flows from surroundings to system | ΔH is negative (-) | E_products < E_reactants"
            ],
            answer: 1,
            explanation: "When a container feels cold, the system absorbs heat from the surroundings (<b>Endothermic</b> process). Thus, energy is added to the system (<b>ΔH > 0</b>) and the final enthalpy of the products is higher than the reactants (<b>E_products > E_reactants</b>)."
        },
        {
            question: "3. Examine the energy level diagram below. What type of reaction does this profile represent?",
            graphic: " [Energy] \n    ▲ \n    │  ________  (Products)\n    │  │\n    │  │  ▲ ΔH = + (Heat Absorbed)\n    │  │__│_____\n    │  ________  (Reactants)\n    └────────────────────────► [Reaction Progress]",
            options: [
                "Exothermic Reaction",
                "Endothermic Reaction",
                "Standard Formation Reaction",
                "Neutralization Reaction"
            ],
            answer: 1,
            explanation: "Because the energy level of the Products is higher than that of the Reactants (ΔH is positive), heat is absorbed from the surroundings. This is the hallmark of an <b>Endothermic Reaction</b>."
        },
        {
            question: "4. Why is bond breaking considered an endothermic process, whereas bond making is an exothermic process?",
            graphic: null,
            options: [
                "Breaking bonds requires an input of energy to overcome forces, while forming stable bonds releases energy.",
                "Breaking bonds releases energy into surroundings, while forming bonds absorbs thermal energy.",
                "Both processes require equal amounts of energy input from the environment.",
                "Breaking bonds is exothermic because energy is freed when atoms separate."
            ],
            answer: 0,
            explanation: "<b>Breaking bonds requires energy (Endothermic / ΔH > 0)</b>. Conversely, <b>forming new bonds releases energy (Exothermic / ΔH < 0)</b> as atoms reach a lower, more stable energy state."
        },
        {
            question: "5. [Prior Knowledge] Which of the following equations represents a Combustion reaction?",
            graphic: null,
            options: [
                "HCl(aq) + NaOH(aq) ➔ NaCl(aq) + H₂O(l)",
                "CH₄(g) + 2O₂(g) ➔ CO₂(g) + 2H₂O(g)",
                "2H₂(g) + O₂(g) ➔ 2H₂O(l)",
                "Na⁺(aq) + Cl⁻(aq) ➔ NaCl(s)"
            ],
            answer: 1,
            explanation: "A <b>Combustion reaction</b> involves a substance (typically a hydrocarbon) reacting rapidly with <b>oxygen gas (O₂)</b> to yield CO₂ and H₂O."
        },
        {
            question: "6. [Prior Knowledge] Which chemical equation represents a Neutralization reaction?",
            graphic: null,
            options: [
                "C₃H₈(g) + 5O₂(g) ➔ 3CO₂(g) + 4H₂O(g)",
                "2H₂(g) + O₂(g) ➔ 2H₂O(l)",
                "HCl(aq) + NaOH(aq) ➔ NaCl(aq) + H₂O(l)",
                "N₂(g) + 3H₂(g) ➔ 2NH₃(g)"
            ],
            answer: 2,
            explanation: "A <b>Neutralization reaction</b> occurs between an Acid (HCl) and a Base (NaOH) to produce a Salt (NaCl) and Water (H₂O)."
        },
        {
            question: "7. [Prior Knowledge] Standard Enthalpy of Formation (ΔH_f°) involves forming 1 mole of a compound from its pure elements in their standard states. Which equation correctly shows the standard formation of liquid water, H₂O(l)?",
            graphic: null,
            options: [
                "H⁺(aq) + OH⁻(aq) ➔ H₂O(l)",
                "H₂(g) + ½ O₂(g) ➔ H₂O(l)",
                "2H₂(g) + O₂(g) ➔ 2H₂O(l)",
                "CO₂(g) + H₂(g) ➔ H₂O(l) + CO(g)"
            ],
            answer: 1,
            explanation: "A standard formation reaction must form exactly <b>1 mole</b> of the compound from its constituent <b>elements in their standard state</b> (diatomic gases H₂ and O₂)."
        },
        {
            question: "8. [Bond Energy Calculation] Given average bond energies:\n• C = C : 614 kJ/mol\n• C - C : 348 kJ/mol\n• C - H : 413 kJ/mol\n• H - H : 436 kJ/mol\n\nCalculate ΔH for the addition reaction:\nCH₂ = CH₂ + H₂ ➔ CH₃ - CH₃",
            graphic: null,
            options: [
                "-124 kJ/mol",
                "+124 kJ/mol",
                "-248 kJ/mol",
                "+850 kJ/mol"
            ],
            answer: 0,
            explanation: "<b>Formula: ΔH = Σ (Bonds Broken / Left) - Σ (Bonds Formed / Right)</b><br><br>" +
                        "<b>Bonds Broken (Reactants):</b> 1(C=C) + 4(C-H) + 1(H-H) = 614 + 4(413) + 436 = 2702 kJ<br>" +
                        "<b>Bonds Formed (Products):</b> 1(C-C) + 6(C-H) = 348 + 6(413) = 2826 kJ<br><br>" +
                        "<b>ΔH = 2702 - 2826 = -124 kJ/mol</b>"
        }
    ];

    // Game Logic
    let currentQuestionIndex = 0;
    let score = 0;

    const questionTextEl = document.getElementById("question-text");
    const graphicAreaEl = document.getElementById("graphic-area");
    const optionsContainerEl = document.getElementById("options-container");
    const feedbackBoxEl = document.getElementById("feedback-box");
    const btnNextEl = document.getElementById("btn-next");
    const progressEl = document.getElementById("progress");
    const quizScreenEl = document.getElementById("quiz-screen");
    const scoreScreenEl = document.getElementById("score-screen");
    const finalScoreEl = document.getElementById("final-score");
    const scoreMessageEl = document.getElementById("score-message");

    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        progressEl.style.width = `${progressPercent}%`;

        questionTextEl.innerHTML = q.question;

        if (q.graphic) {
            graphicAreaEl.style.display = "block";
            graphicAreaEl.textContent = q.graphic;
        } else {
            graphicAreaEl.style.display = "none";
        }

        optionsContainerEl.innerHTML = "";
        feedbackBoxEl.style.display = "none";
        feedbackBoxEl.className = "feedback-box";
        btnNextEl.style.display = "none";

        q.options.forEach((option, index) => {
            const btn = document.createElement("button");
            btn.className = "btn-option";
            btn.innerHTML = option;
            btn.onclick = () => selectAnswer(index);
            optionsContainerEl.appendChild(btn);
        });
    }

    function selectAnswer(selectedIndex) {
        const q = questions[currentQuestionIndex];
        const buttons = optionsContainerEl.querySelectorAll(".btn-option");

        buttons.forEach(btn => btn.disabled = true);

        if (selectedIndex === q.answer) {
            buttons[selectedIndex].classList.add("correct");
            feedbackBoxEl.innerHTML = `<b>Correct Answer! 🎉</b><br>${q.explanation}`;
            feedbackBoxEl.classList.add("correct");
            score++;
        } else {
            buttons[selectedIndex].classList.add("wrong");
            buttons[q.answer].classList.add("correct");
            feedbackBoxEl.innerHTML = `<b>Incorrect Answer! ❌</b><br>${q.explanation}`;
            feedbackBoxEl.classList.add("wrong");
        }

        feedbackBoxEl.style.display = "block";
        btnNextEl.style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showScoreScreen();
        }
    }

    function showScoreScreen() {
        progressEl.style.width = "100%";
        quizScreenEl.style.display = "none";
        scoreScreenEl.style.display = "block";

        finalScoreEl.textContent = `${score} / ${questions.length}`;

        const percentage = (score / questions.length) * 100;
        if (percentage === 100) {
            scoreMessageEl.textContent = "Outstanding! Your grasp of Thermochemistry concepts is top-notch! 🧠⚡";
        } else if (percentage >= 70) {
            scoreMessageEl.textContent = "Great work! You are well-prepared to move into advanced thermochemistry topics! 👍";
        } else {
            scoreMessageEl.textContent = "Good try! Take a moment to review basic thermochemistry concepts and try again! 💪";
        }
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        quizScreenEl.style.display = "block";
        scoreScreenEl.style.display = "none";
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
